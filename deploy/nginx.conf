# Equivalent nginx de deploy/apache-vhost.conf, per a la imatge Docker.
# La terminació TLS (necessària per al service worker fora de localhost)
# es fa al proxy invers que hi hagi davant del contenidor.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # App d'una sola pàgina: qualsevol ruta desconeguda porta a l'app.
    error_page 404 /index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Un bloc `types` substitueix tota la taula MIME heretada: limita'l a aquesta ruta.
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        types { }
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/manifest+json image/svg+xml;
}
