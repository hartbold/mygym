# Vhost per a MY GYM (app estàtica d'una sola pàgina). Substitueix
# gym.example.com i les rutes pels valors reals. Requereix mod_mime,
# mod_headers, mod_deflate i mod_ssl habilitats (a2enmod ... a Debian/Ubuntu).
#
# Pas 0 (fora d'aquest fitxer): crea el registre DNS A/AAAA del subdomini
# cap a aquest servidor ABANS de continuar, i obre el port 80/443.

<VirtualHost *:80>
    ServerName gym.example.com
    Redirect permanent / https://gym.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName gym.example.com
    DocumentRoot /var/www/gym

    # SSLCertificateFile / SSLCertificateKeyFile: gestionats per certbot
    # (`sudo certbot --apache -d gym.example.com`). Els service workers
    # exigeixen HTTPS (excepte localhost).

    <Directory /var/www/gym>
        AllowOverride None
        Options -Indexes -MultiViews
        DirectoryIndex index.html
        DirectorySlash On
        Require all granted
    </Directory>

    # App d'una sola pàgina (§Decisió d'arquitectura): qualsevol ruta
    # desconeguda ha de portar a l'app, que interpreta el fragment #.
    ErrorDocument 404 /index.html

    <IfModule mod_mime.c>
        AddType application/manifest+json .webmanifest
    </IfModule>

    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
        # Política estàtica de Next (docs oficials): 'unsafe-inline' a
        # script-src és necessari perquè un export estàtic sempre incrusta
        # el bootstrap i el payload RSC en <script> inline; un nonce exigeix
        # renderitzat dinàmic, incompatible amb output:'export'.
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        # Sense hash (_next/static/** ja porta noms de fitxer amb hash del
        # contingut), tot es serveix amb no-cache: el SW ja fa cache:'reload'
        # en instal·lar, així que la memòria cau HTTP només ajuda en la
        # primera visita mai cachejada.
        Header set Cache-Control "no-cache"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/manifest+json image/svg+xml
    </IfModule>
</VirtualHost>
